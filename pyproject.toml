[project]
name = "many-schemas-in-spectacular-drf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.1",
    "django-extensions>=4.1",
    "djangorestframework>=3.16.1",
    "drf-spectacular[sidecar]>=0.29.0",
    "faker>=40.1.0",
    "ipython>=9.2.0",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.5",
    "pytest>=8.4.1",
    "pytest-django>=4.11.1",
    "ty>=0.0.8",
]

[tool.pytest.ini_options]
minversion = "6.0"
DJANGO_SETTINGS_MODULE = "app.settings"
pythonpath = ["src"]
